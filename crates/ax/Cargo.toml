[package]
name = "ax"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ax — systems language for AI agents. Compiler protocol, oracle interpreter, M0/M1 kernel."
default-run = "ax"

[[bin]]
name = "ax"
path = "src/main.rs"

[lib]
name = "ax"
path = "src/lib.rs"

[dependencies]
# The dev-tier backend. Same IR as the C backend, compiled in-process: no `cc`
# spawn, no temporary files, and the differential suite gets a third independent
# implementation of the semantics to disagree with.
cranelift-codegen = "0.134"
cranelift-frontend = "0.134"
cranelift-module = "0.134"
cranelift-jit = "0.134"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
cranelift-native = "0.134"

[dev-dependencies]
pretty_assertions = "1"
