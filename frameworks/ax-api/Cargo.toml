[package]
name = "ax-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone high-performance REST API framework for Ax"

[[bin]]
name = "ax-api"
path = "src/main.rs"

[lib]
name = "ax_api"
path = "src/lib.rs"

[dependencies]
ax = { path = "../../crates/ax" }
rustls = "0.23"
rustls-pemfile = "2"
